<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A bilingual guide to how LLM inference parameters affect quality, latency, and cost.">
  <title>LLM inference parameters | Inference Atlas</title>
  <style>
:root {
  --bg: #0a0a0b;
  --elev: #0f0f11;
  --ink: #ececee;
  --dim: rgba(236, 236, 238, 0.76);
  --faint: rgba(236, 236, 238, 0.14);
  --fainter: rgba(236, 236, 238, 0.06);
  --accent: #00ff9c;
  --accent-dim: rgba(0, 255, 156, 0.16);
  --mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --maxw: 1200px;
  --pad: clamp(24px, 5vw, 80px);
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  font: inherit;
}
::selection {
  background: var(--accent);
  color: #000;
}
main {
  min-height: 100vh;
  position: relative;
}
.bgLayer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.bgGrid {
  background-image:
    linear-gradient(to right, rgba(236, 236, 238, 0.05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(236, 236, 238, 0.05) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse at 50% 0%, #000, transparent 82%);
}
.bgScan {
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 2px,
    rgba(255, 255, 255, 0.018) 2px 3px
  );
  opacity: 0.22;
}
.bgGlow {
  background:
    radial-gradient(
      ellipse 800px 500px at 82% -10%,
      var(--accent-dim),
      transparent 70%
    ),
    radial-gradient(
      ellipse 600px 400px at -10% 30%,
      rgba(0, 255, 156, 0.07),
      transparent 70%
    );
}
.topbar,
.wrap,
.filters,
.glossary,
.grid,
.recipes,
.principle,
footer {
  position: relative;
  z-index: 1;
}
.wrap {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 var(--pad);
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  height: 68px;
  padding: 0 var(--pad);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--faint);
  background: rgba(10, 10, 11, 0.74);
  backdrop-filter: blur(12px);
}
.brand {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  color: var(--dim);
  text-transform: uppercase;
}
.brand b {
  color: var(--ink);
  font-weight: 600;
}
.brand span {
  color: var(--accent);
}
.navActions {
  display: flex;
  align-items: center;
  gap: 20px;
}
.portfolioLink {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dim);
  transition: color 0.2s;
}
.portfolioLink:hover {
  color: var(--accent);
}
.language {
  height: 34px !important;
  padding: 2px !important;
  border: 1px solid var(--faint);
  border-radius: 2px !important;
  background: var(--elev) !important;
}
.language button {
  height: 28px !important;
  min-width: 40px;
  border-radius: 1px !important;
  color: var(--dim) !important;
  font-family: var(--mono);
  font-size: 12px !important;
  letter-spacing: 0.12em;
  cursor: pointer;
}
.language button[data-state="active"] {
  background: var(--accent) !important;
  color: #000 !important;
  box-shadow: none !important;
}
.hero {
  min-height: 650px;
  padding: clamp(78px, 12vh, 140px) 0 clamp(90px, 14vh, 160px);
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(290px, 0.65fr);
  align-items: center;
  gap: 7vw;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 6px 12px;
  border: 1px solid var(--accent);
  border-radius: 999px;
  background: rgba(0, 255, 156, 0.04);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.pill i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
  animation: pulse 2.2s infinite;
}
.hero h1 {
  position: relative;
  display: inline-block;
  max-width: 850px;
  margin: 28px 0 0;
  font-family: var(--mono);
  font-size: clamp(48px, 8.5vw, 126px);
  font-weight: 700;
  line-height: 0.9;
  letter-spacing: -0.055em;
  text-wrap: balance;
}
.caret {
  color: var(--accent);
  font-weight: 500;
  animation: blink 1.05s steps(2) infinite;
}
.glitch:before,
.glitch:after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: 0;
}
.glitch:before {
  color: var(--accent);
  transform: translateX(-2px);
  clip-path: polygon(0 0, 100% 0, 100% 44%, 0 44%);
  animation: glitchA 4.3s steps(1) infinite;
}
.glitch:after {
  color: #ff3ea5;
  transform: translateX(2px);
  clip-path: polygon(0 58%, 100% 58%, 100% 100%, 0 100%);
  animation: glitchB 4.3s steps(1) infinite;
}
.lead {
  max-width: 680px;
  margin: 34px 0 0;
  color: var(--dim);
  font-size: clamp(16px, 1.6vw, 20px);
  line-height: 1.6;
}
.chart {
  height: 280px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 6px;
  position: relative;
  padding: 30px 20px 34px;
  border: 1px solid var(--faint);
  background:
    linear-gradient(rgba(255, 255, 255, 0.018), rgba(255, 255, 255, 0.008)),
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 55px,
      var(--fainter) 56px
    );
  box-shadow: 0 20px 80px rgba(0, 0, 0, 0.45);
}
.chart > b {
  position: absolute;
  left: 14px;
  top: 12px;
  color: var(--dim);
  font: 500 12px var(--mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.chart > i {
  width: clamp(12px, 2vw, 28px);
  background: var(--accent);
  opacity: 0.72;
  box-shadow: 0 0 12px rgba(0, 255, 156, 0.16);
  animation: rise 0.7s both;
}
.chart span {
  position: absolute;
  right: 12px;
  bottom: 10px;
  color: var(--dim);
  font: 12px var(--mono);
}
.filters {
  padding: 18px max(var(--pad), calc((100vw - var(--maxw)) / 2 + var(--pad)));
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  border-block: 1px solid var(--faint);
  background: rgba(10, 10, 11, 0.84);
  backdrop-filter: blur(10px);
}
.filterPrompt {
  margin-right: 10px;
  color: var(--accent);
  font: 12px var(--mono);
  letter-spacing: 0.08em;
}
.filters button {
  padding: 7px 12px;
  border: 1px solid var(--faint);
  border-radius: 2px;
  background: transparent;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: 0.2s;
}
.filters button:hover {
  color: var(--ink);
  border-color: var(--ink);
}
.filters button.active {
  color: #000;
  background: var(--accent);
  border-color: var(--accent);
}
.glossary {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 36px var(--pad) 0;
  display: grid;
  grid-template-columns: minmax(190px, 0.32fr) minmax(0, 1fr);
  gap: 32px;
  align-items: start;
}
.glossaryIntro h2 {
  margin: 0;
  color: var(--ink);
  font-size: 18px;
  font-weight: 600;
}
.glossaryIntro p {
  margin: 8px 0 0;
  color: var(--dim);
  font-size: 15px;
  line-height: 1.6;
}
.glossaryTerms {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}
.glossaryTerm {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 8px 11px;
  border: 1px solid var(--faint);
  border-radius: 2px;
  background: var(--elev);
  color: var(--ink);
  font-size: 14px;
  cursor: pointer;
  transition:
    color 0.2s,
    border-color 0.2s,
    background 0.2s;
}
.glossaryTerm:hover,
.glossaryTerm:focus-visible {
  border-color: var(--accent);
  background: rgba(0, 255, 156, 0.05);
  color: var(--accent);
  outline: none;
}
.glossaryTerm span {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  border: 1px solid currentColor;
  border-radius: 50%;
  font: 11px var(--mono);
}
.glossaryPopover {
  z-index: 80 !important;
  width: min(340px, calc(100vw - 32px)) !important;
  border-color: rgba(0, 255, 156, 0.42) !important;
  border-radius: 2px !important;
  background: #121214 !important;
  color: var(--ink) !important;
  box-shadow: 0 18px 55px rgba(0, 0, 0, 0.55) !important;
}
.glossaryPopoverTitle {
  color: var(--accent);
  font: 500 14px var(--mono);
}
.glossaryPopoverDescription {
  margin-top: 8px;
  color: var(--dim) !important;
  font-size: 15px;
  line-height: 1.65;
}
.grid {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: clamp(64px, 9vh, 110px) var(--pad);
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
}
.card {
  position: relative;
  display: block;
  min-height: 0;
  padding: 44px 0;
  border-top: 1px solid var(--faint);
  transition:
    padding 0.25s,
    background 0.25s;
}
.card:last-child {
  border-bottom: 1px solid var(--faint);
}
.card:before {
  display: none;
}
.card:hover {
  background: linear-gradient(90deg, rgba(0, 255, 156, 0.025), transparent 65%);
}
.meta {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
}
.meta > span {
  color: var(--dim);
  font: 12px var(--mono);
}
.meta b {
  padding: 6px 10px;
  border: 1px solid var(--faint);
  border-radius: 999px;
  color: var(--dim);
  font: 11px var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.meta b.sampling,
.meta b.length,
.meta b.behavior,
.meta b.reasoning,
.meta b.control {
  background: transparent;
  color: var(--accent);
  border-color: rgba(0, 255, 156, 0.42);
}
.card h2 {
  margin: 28px 0 0;
  font-size: clamp(28px, 3vw, 38px);
  font-weight: 500;
  letter-spacing: -0.02em;
}
.card h2 code {
  font-family: var(--mono);
  font-weight: 500;
}
.card:hover h2 {
  color: var(--accent);
}
.intro {
  margin: 18px 0 0;
  color: var(--ink);
  font-size: 17px;
  line-height: 1.6;
  font-weight: 500;
}
.detail {
  max-width: 900px;
  margin: 18px 0 0;
  color: var(--dim);
  font-size: 16px;
  line-height: 1.75;
}
.card dl {
  margin: 32px 0 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  border-block: 1px solid var(--fainter);
}
.card dl > div {
  min-width: 0;
  padding: 20px 28px 20px 0;
}
.card dl > div + div {
  padding-left: 28px;
  border-left: 1px solid var(--fainter);
}
dt,
.range span {
  color: var(--accent);
  font: 11px var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
dd {
  margin: 9px 0 0;
  color: var(--dim);
  font-size: 15px;
  line-height: 1.65;
}
.card .impact,
.card .example {
  margin-top: 18px;
  padding: 18px 20px;
}
.card .impact {
  border: 1px solid var(--fainter);
  background: rgba(255, 255, 255, 0.012);
}
.card .example {
  border-left: 2px solid rgba(122, 205, 255, 0.8);
  background: rgba(122, 205, 255, 0.035);
}
.card .impact h3,
.card .example h3 {
  margin: 0;
  color: var(--accent);
  font: 11px var(--mono);
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.card .example h3 {
  color: #7acdff;
}
.card .impact p,
.card .example p {
  max-width: 980px;
  margin: 10px 0 0;
  color: var(--dim);
  font-size: 15px;
  line-height: 1.7;
}
.paramComparison {
  margin-top: 18px;
  border: 1px solid rgba(122, 205, 255, 0.24);
  background: rgba(122, 205, 255, 0.018);
}
.paramComparison > header {
  padding: 20px;
  border-bottom: 1px solid var(--fainter);
}
.paramComparison > header h3 {
  margin: 0;
  color: #7acdff;
  font: 12px var(--mono);
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.paramComparison > header p,
.comparisonConclusion {
  max-width: 940px;
  margin: 10px 0 0;
  color: var(--dim);
  font-size: 15px;
  line-height: 1.7;
}
.comparisonHead,
.comparisonRow {
  display: grid;
  grid-template-columns: minmax(130px, 0.35fr) repeat(2, minmax(0, 1fr));
}
.comparisonHead {
  border-bottom: 1px solid var(--fainter);
}
.comparisonHead code {
  padding: 12px 18px;
  color: var(--accent);
  font: 12px var(--mono);
}
.comparisonHead code + code,
.comparisonRow > div + div {
  border-left: 1px solid var(--fainter);
}
.comparisonRow {
  border-bottom: 1px solid var(--fainter);
}
.comparisonRow h4,
.comparisonRow > div {
  margin: 0;
  padding: 18px;
}
.comparisonRow h4 {
  color: var(--ink);
  font: 12px var(--mono);
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.comparisonRow > div > code {
  display: none;
  color: var(--accent);
  font: 11px var(--mono);
}
.comparisonRow p {
  margin: 0;
  color: var(--dim);
  font-size: 15px;
  line-height: 1.7;
}
.comparisonConclusion {
  margin: 0;
  padding: 20px;
  color: var(--ink);
}
.range {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 22px;
}
.range code {
  padding: 7px 10px;
  border: 1px solid var(--faint);
  color: var(--ink);
  font: 13px var(--mono);
}
.card aside {
  width: 100%;
  margin-top: 18px;
  padding: 14px 16px;
  border-left: 2px solid var(--accent);
  background: rgba(0, 255, 156, 0.035);
  color: var(--dim);
  font-size: 15px;
  line-height: 1.65;
}
.card aside strong {
  color: var(--accent);
  font-family: var(--mono);
  font-weight: 500;
}
.recipes {
  padding: clamp(74px, 10vh, 120px)
    max(var(--pad), calc((100vw - var(--maxw)) / 2 + var(--pad)));
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 40px;
  border-top: 1px solid var(--faint);
}
.recipeIntro .eyebrow {
  margin: 0 0 18px;
  color: var(--accent);
  font: 12px var(--mono);
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.recipeIntro .eyebrow i {
  display: none;
}
.recipeIntro h2 {
  margin: 0;
  font-size: clamp(26px, 3vw, 38px);
  font-weight: 500;
  line-height: 1.12;
}
.recipeIntro > p:last-child {
  margin-top: 20px;
  color: var(--dim);
  font-size: 15px;
  line-height: 1.65;
}
.recipeGrid {
  display: grid;
  gap: 0;
}
.recipeGrid article {
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 18px;
  padding: 28px 0;
  border-top: 1px solid var(--faint);
}
.recipeGrid article:last-child {
  border-bottom: 1px solid var(--faint);
}
.recipeGrid em {
  padding-top: 4px;
  color: var(--accent);
  font: 13px var(--mono);
  font-style: normal;
}
.recipeGrid h3 {
  margin: 0 0 14px;
  font-size: 22px;
  font-weight: 500;
}
.recipeGrid ul {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.recipeGrid li {
  padding: 7px 9px;
  border: 1px solid var(--faint);
  background: var(--elev);
}
.recipeGrid code {
  color: var(--dim);
  font: 13px var(--mono);
}
.principle {
  max-width: calc(var(--maxw) - var(--pad) * 2);
  margin: 0 auto clamp(70px, 10vh, 120px);
  padding: 28px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 28px;
  align-items: center;
  border: 1px dashed var(--faint);
  background: rgba(0, 255, 156, 0.025);
}
.principle > b {
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  border: 1px solid var(--accent);
  transform: rotate(45deg);
  color: var(--accent);
  font: 700 26px var(--mono);
}
.principle > b span {
  transform: rotate(-45deg);
}
.principle h2 {
  margin: 0 0 8px;
  color: var(--accent);
  font: 13px var(--mono);
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.principle p {
  max-width: 820px;
  margin: 0;
  color: var(--dim);
  font-size: 16px;
  line-height: 1.65;
}
footer {
  min-height: 140px;
  padding: 36px var(--pad);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 30px;
  border-top: 1px solid var(--faint);
}
footer a {
  color: var(--ink);
  font: 12px var(--mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
footer a:hover {
  color: var(--accent);
}
footer p {
  max-width: 620px;
  margin: 0;
  color: var(--dim);
  font: 12px/1.65 var(--mono);
  text-align: right;
}
@keyframes pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(0, 255, 156, 0.5);
  }
  70% {
    box-shadow: 0 0 0 10px transparent;
  }
  100% {
    box-shadow: 0 0 0 0 transparent;
  }
}
@keyframes blink {
  50% {
    opacity: 0;
  }
}
@keyframes rise {
  from {
    transform: scaleY(0.12);
    opacity: 0.1;
  }
}
@keyframes glitchA {
  0%,
  93%,
  100% {
    opacity: 0;
    transform: translate(-2px);
  }
  94% {
    opacity: 0.7;
    transform: translate(-4px);
  }
  95% {
    opacity: 0.9;
    transform: translate(1px, 1px);
  }
  96% {
    opacity: 0.4;
    transform: translate(-3px, -1px);
  }
  97% {
    opacity: 0;
  }
}
@keyframes glitchB {
  0%,
  93%,
  100% {
    opacity: 0;
    transform: translate(2px);
  }
  94% {
    opacity: 0.6;
    transform: translate(4px, 1px);
  }
  95% {
    opacity: 0.8;
    transform: translate(-1px, -1px);
  }
  96% {
    opacity: 0.4;
    transform: translate(3px, 1px);
  }
  97% {
    opacity: 0;
  }
}
@media (max-width: 900px) {
  .hero {
    grid-template-columns: 1fr;
  }
  .chart {
    height: 220px;
    max-width: 560px;
  }
  .range {
    margin-top: 22px;
  }
  .card aside {
    margin-top: 18px;
  }
  .recipes {
    grid-template-columns: 1fr;
    gap: 28px;
  }
  .principle {
    margin-inline: var(--pad);
  }
}
@media (max-width: 640px) {
  .topbar {
    height: 62px;
  }
  .brand {
    font-size: 10px;
    letter-spacing: 0.1em;
  }
  .portfolioLink {
    display: none;
  }
  .navActions {
    gap: 8px;
  }
  .hero {
    min-height: auto;
    padding: 72px 0 86px;
  }
  .hero h1 {
    font-size: clamp(43px, 14vw, 68px);
  }
  .chart {
    height: 165px;
  }
  .filters {
    padding-inline: var(--pad);
  }
  .filterPrompt {
    width: 100%;
    margin-bottom: 5px;
  }
  .glossary {
    grid-template-columns: 1fr;
    gap: 18px;
    padding-top: 28px;
  }
  .card {
    gap: 13px;
    padding: 34px 0;
  }
  .card dl {
    grid-template-columns: 1fr;
  }
  .card dl > div + div {
    padding-left: 0;
    border-left: 0;
    padding-top: 18px;
  }
  .range {
    flex-wrap: wrap;
  }
  .comparisonHead {
    display: none;
  }
  .comparisonRow {
    grid-template-columns: 1fr;
  }
  .comparisonRow h4 {
    padding-bottom: 0;
  }
  .comparisonRow > div + div {
    border-left: 0;
    border-top: 1px solid var(--fainter);
  }
  .comparisonRow > div > code {
    display: block;
    margin-bottom: 9px;
  }
  .principle {
    grid-template-columns: 1fr;
  }
  .principle > b {
    width: 50px;
    height: 50px;
  }
  footer {
    align-items: flex-start;
    flex-direction: column;
  }
  footer p {
    text-align: left;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    animation: none !important;
    transition: none !important;
  }
}

  <script>(function clientBoot(DATA) {

    const example = DATA.EXAMPLES[parameter.name];
    const comparison = DATA.TOP_P_COMPARISON[lang];
    const comparisonHtml =
      parameter.name === "top_p"
        ? `<section class="paramComparison">
            <header><h3>${h(comparison.title)}</h3><p>${h(comparison.lead)}</p></header>
            <div class="comparisonHead" aria-hidden="true"><span></span><code>temperature</code><code>top_p</code></div>
            ${comparison.rows
              .map(
                (row) => `<div class="comparisonRow">
                  <h4>${h(row.label)}</h4>
                  <div><code>temperature</code><p>${h(row.temperature)}</p></div>
                  <div><code>top_p</code><p>${h(row.topP)}</p></div>
                </div>`,
              )
              .join("")}
            <p class="comparisonConclusion">${h(comparison.conclusion)}</p>
          </section>`
        : "";

    return `<article class="card">
      <div class="meta"><span>${String(index).padStart(2, "0")}</span><b class="${h(parameter.group)}">${h(t.groups[parameter.group])}</b></div>

        <div class="range"><span>${h(t.range)}</span><code>${h(guide.range[lang])}</code></div>
      </div>
      <dl>
        <div><dt>${h(t.low)}</dt><dd>${h(guidanceFor(parameter, "low"))}</dd></div>
        <div><dt>${h(t.high)}</dt><dd>${h(guidanceFor(parameter, "high"))}</dd></div>

      ${example ? `<section class="example"><h3>${h(t.example)}</h3><p>${h(example[lang])}</p></section>` : ""}
      ${comparisonHtml}
      <aside><strong>↳ ${h(t.tip)}:</strong> ${h(guidanceFor(parameter, "tip"))}</aside>
    </article>`;
  }

  function render() {
    const t = DATA.L[lang];
    const visible =
      group === "all" ? DATA.P : DATA.P.filter((parameter) => parameter.group === group);
    document.documentElement.lang = lang;
    document.title =
      lang === "pl"
        ? "Parametry inferencji LLM | Inference Atlas"
        : "LLM inference parameters | Inference Atlas";

    root.innerHTML = `<main>
      <div class="bgLayer bgGrid" aria-hidden="true"></div>

      <div class="bgLayer bgGlow" aria-hidden="true"></div>

        <span class="filterPrompt">${h(t.filter)}</span>

        <div class="glossaryTerms">
          ${DATA.GLOSSARY.map(

              .join("")}</ul></div></article>`,
          ).join("")}
        </div>
      </section>
      <aside class="principle"><b><span>!</span></b><div><h2>${h(t.note)}</h2><p>${h(t.noteBody)}</p></div></aside>
      <footer><a href="https://krzjablonski.github.io/" target="_blank" rel="noreferrer">krzjablonski.github.io ↗</a><p>${h(t.footer)}</p></footer>
    </main>`;
  }

  document.addEventListener("click", (event) => {

      render();
      return;
    }

    const groupButton = event.target.closest("[data-group]");
    if (groupButton) {
      group = groupButton.dataset.group;
      render();

    }

    const glossaryButton = event.target.closest("[data-glossary]");

      dialogText.textContent = item.definition[lang];
      dialog.showModal();
      return;
    }

    if (event.target.closest("[data-close-dialog]")) dialog.close();
  });

  dialog.addEventListener("click", (event) => {
